# Local Final Project stack: MLflow registry, one-time trainer, forecast API,
# and the original Milestone 1 Airflow service.
#
#   docker compose up --build mlflow trainer api
#
services:
  # MLflow tracking server (Milestone 2). SQLite backend + local artifact
  # store, both persisted under ./mlflow/. Start with:
  #
  #   docker compose up mlflow
  #
  # then point training at it:
  #
  #   MLFLOW_TRACKING_URI=http://localhost:5000 uv run python models/train.py
  #
  # UI: http://localhost:5000
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow-server.db
      --artifacts-destination /mlflow/mlartifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/health', timeout=5)
      interval: 5s
      timeout: 5s
      retries: 20

  trainer:
    build: .
    command: ["uv", "run", "--no-sync", "python", "scripts/ensure_registered_model.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-revenue-forecast-bundle}
      GIT_PYTHON_REFRESH: quiet
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-revenue-forecast-bundle}
      MODEL_VERSION: ${MODEL_VERSION:-champion}
    depends_on:
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.4-python3.11
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "pandera>=0.20,<0.23"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
