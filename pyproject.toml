[project]
name = "aim-mlops"
version = "0.1.0"
description = "End-to-end revenue forecasting MLOps system with MLflow, FastAPI, Docker, automated tests, CI, and Evidently drift monitoring."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ── core data ──
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    # ── enforced data-quality check ──
    "pandera>=0.20,<0.23",
    # ── forecasting pipeline (phases 2–5) ──
    "statsforecast>=1.7,<2",
    "statsmodels>=0.14,<0.15",
    "ruptures>=1.1,<2",
    "scipy>=1.11,<2",
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
    "stripe>=9.0,<10",
    # ── Streamlit revenue page ──
    "streamlit>=1.32,<2",
    "plotly>=5.18,<6",
    # ── experiment tracking (Milestone 2) ──
    "mlflow>=3,<4",
    # ── model serving + monitoring (Final Project) ──
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "evidently>=0.7.21,<0.8",
]

[project.optional-dependencies]
# Airflow is heavy and pins a large transitive tree, so it is not required to
# run the pipeline via `uv run` or the tests. Install it only to serve the DAG
# in the Airflow UI:  `uv sync --extra airflow`  (or use docker compose).
airflow = [
    "apache-airflow>=2.9,<2.11",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<0.9",
    "pytest>=8.0,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "pre-commit>=3.7,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# BLE001 blind-except is used intentionally in storage.py (S3 404 handling).
ignore = ["E501"]

[tool.ruff.lint.isort]
# The gitignored local MLflow store (mlflow/) would otherwise make ruff
# classify the `mlflow` package as first-party on machines where it exists,
# producing import-sort results that differ from CI. Pin it.
known-third-party = ["mlflow"]

[tool.ruff.lint.per-file-ignores]
# Runners and the standalone dashboard deliberately set sys.path before their
# imports, so module-level imports are not at the top of the file.
"scripts/*.py" = ["E402"]
"models/*.py" = ["E402"]
"dashboard.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve the repo root as an import path so tests can import `models.train`
# and `src.*` without sys.path hacks (Milestone 2 spec requirement).
pythonpath = ["."]

# ── Coverage ─────────────────────────────────────────────────────────────────
# Scope: pipeline + training code. Entry-point wrappers (scripts/, dags/,
# dashboard.py), the Streamlit UI, and the live-Stripe ingest (needs an API
# key) are excluded — they are thin shells or require external services.
[tool.coverage.run]
source = ["app", "models", "monitoring", "src"]
omit = [
    "dashboard.py",
    "scripts/*",
    "dags/*",
    "src/pages/*",
    "src/revenue/phase0_ingest.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
